  <title>Workshops - Julie-Ann Brown</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="apple-touch-icon" href="images/logo.png" />
  <meta name="theme-color" content="#fafafa" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <nav>
      <div class="logo-container">
        <img src="images/logo.png" alt="Julie-Ann Brown Logo" class="nav-logo-icon" />
        <a class="logo" href="index.html">Julie-Ann Brown</a>
      </div>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="workshops.html" class="active">Workshops</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="social-icons">
        <a href="https://instagram.com/julieannbrownartist" target="_blank" rel="noopener noreferrer"
          class="social-link" title="Instagram">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <circle cx="17.5" cy="6.5" r="1.5"></circle>
          </svg>
        </a>
        <a href="https://www.facebook.com/JulieAnnBrownArtist/" target="_blank" rel="noopener noreferrer"
          class="social-link" title="Facebook">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 2h-3a6 6 0 0 0-6 6v3H2v4h7v8h4v-8h3l1-4h-4V8a2 2 0 0 1 2-2h3z"></path>
          </svg>
        </a>
        <a href="https://www.linkedin.com/in/julie-ann-brown-967691a3/" target="_blank" rel="noopener noreferrer"
          class="social-link" title="LinkedIn">
          <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>
      </div>
    </nav>
  </header>

  <main class="workshops-container">
    <h1>Workshops & Classes</h1>
    <p class="workshops-intro">Join Julie-Ann for her upcoming workshops after their commencement during Margaret River
      Open Studios 2026.</p>

    <div id="workshops-list" class="workshops-grid">
      <!-- Populated by workshops.js -->
    </div>
  </main>

  <!-- Enrollment Form Modal -->
  <div id="enrol-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeEnrolForm()">&times;</button>
      <h2 id="enrol-modal-title">Enrol in Workshop</h2>

      <form id="enrol-form" onsubmit="submitEnrolForm(event)">
        <div class="form-group">
          <label for="enrol-first-name">First Name *</label>
          <input type="text" id="enrol-first-name" name="firstName" required>
        </div>

        <div class="form-group">
          <label for="enrol-last-name">Last Name *</label>
          <input type="text" id="enrol-last-name" name="lastName" required>
        </div>

        <div class="form-group">
          <label for="enrol-email">Email *</label>
          <input type="email" id="enrol-email" name="email" required>
        </div>

        <div class="form-group">
          <label for="enrol-phone">Phone Number *</label>
          <input type="tel" id="enrol-phone" name="phone" required>
        </div>

        <div id="enrol-days-group" class="form-group hidden">
          <label for="enrol-days">Number of Days *</label>
          <select id="enrol-days" name="days">
            <option value="">Select...</option>
            <option value="1">1 Day</option>
            <option value="2">2 Days</option>
          </select>
        </div>

        <div class="form-group">
          <label id="enrol-cost-label"></label>
        </div>

        <button type="submit" class="btn-enrol-submit">Complete Enrollment & Pay</button>
      </form>

      <p class="form-note">You will be redirected to payment after submitting this form.</p>
    </div>
  </div>

  <script src="js/workshops.js"></script>
</body>

</html>
