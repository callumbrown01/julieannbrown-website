<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Julie-Ann Brown</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
    }

    .admin-wrap {
      max-width: 960px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    #login-screen {
      max-width: 360px;
      margin: 6rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
    }

    #login-screen h2 {
      margin-bottom: 1.5rem;
    }

    #login-screen input {
      width: 100%;
      padding: 0.7rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    .hidden {
      display: none !important;
    }

    .upload-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
      margin-bottom: 1.5rem;
    }

    .upload-row input[type=text],
    .upload-row input[type=number],
    .upload-row select {
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .upload-row input[type=file] {
      font-size: 0.9rem;
    }

    .drag-handle {
      cursor: grab;
      font-size: 1.2rem;
      margin-right: 6px;
    }

    /* Modal Styles */
    #edit-gallery-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.4);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 5% auto;
      padding: 2rem;
      border: 1px solid #888;
      border-radius: 8px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .modal-close {
      color: #aaa;
      float: right;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-close:hover {
      color: black;
    }

    .modal-header {
      margin-bottom: 1.5rem;
    }

    .modal-form-group {
      margin-bottom: 1rem;
    }

    .modal-form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .modal-form-group input,
    .modal-form-group select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }

    .modal-form-group select {
      height: auto;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .modal-actions button {
      flex: 1;
    }
  </style>
</head>

<body>

  <!-- Login Screen -->
  <div id="login-screen">
    <h2>Admin Login</h2>
    <input id="pat-input" type="password" placeholder="GitHub Personal Access Token (PAT)" />
    <input id="pwd-input" type="password" placeholder="Admin Password" />
    <button class="btn" onclick="checkLogin()">Login</button>
    <p id="login-error" style="color:red;margin-top:0.5rem"></p>
  </div>

  <!-- Admin Panel (hidden until login) -->
  <div id="admin-panel" class="admin-wrap hidden">
    <h1 style="margin-bottom:2rem">🖌 Admin Panel</h1>

    <!-- Gallery Management -->
    <div class="admin-section">
      <h2>Gallery Images</h2>
      <div class="upload-row">
        <input type="file" id="gallery-file" accept="image/*" />
        <input type="text" id="gallery-title" placeholder="Title" />
        <select id="gallery-category">
          <option value="">Select Categories (hold Ctrl/Cmd for multiple)</option>
          <option value="Landscape">Landscape</option>
          <option value="Portrait">Portrait</option>
          <option value="Creatures">Creatures</option>
          <option value="Waterwork">Waterwork</option>
          <option value="Still Life">Still Life</option>
        </select>
        <label><input type="checkbox" id="gallery-featured" /> Featured on Home</label>
        <button class="btn" onclick="uploadGalleryImage()">Upload & Add</button>
      </div>
      <div id="gallery-admin-list" class="admin-image-list" ondragover="event.preventDefault()"></div>
    </div>

    <!-- Shop Management -->
    <div class="admin-section">
      <h2>Shop Items</h2>
      <p style="margin-bottom:1rem;color:#666">Drag items to reorder. Changes save automatically.</p>
      <div class="upload-row">
        <input type="file" id="shop-file" accept="image/*" />
        <input type="text" id="shop-title" placeholder="Title" />
        <input type="number" id="shop-price" placeholder="Price (AUD)" />
        <input type="text" id="shop-medium" placeholder="Medium & size" />
        <input type="text" id="shop-stripe" placeholder="Stripe Buy Link" />
        <button class="btn" onclick="uploadShopItem()">Add to Shop</button>
      </div>
      <div id="shop-admin-list" class="admin-image-list" ondragover="event.preventDefault()"></div>
    </div>

    <!-- Workshops Management -->
    <div class="admin-section">
      <h2>Workshops & Classes</h2>
      <form id="workshop-form">
        <div class="upload-row">
          <input type="file" id="workshop-file" accept="image/*" />
          <input type="text" id="workshop-title" placeholder="Workshop Title" required />
          <input type="date" id="workshop-date" required />
          <input type="time" id="workshop-time" required />
          <input type="text" id="workshop-duration" placeholder="e.g., 3 hours" required />
        </div>
        <div class="upload-row">
          <textarea id="workshop-description" placeholder="Description"
            style="flex:1;padding:0.6rem;border:1px solid #ccc;border-radius:4px;font-size:0.9rem;min-height:80px;font-family:sans-serif"></textarea>
        </div>
        <div class="upload-row">
          <input type="number" id="workshop-cost" placeholder="Cost (AUD)" step="0.01" required />
          <input type="number" id="workshop-slots" placeholder="Max Slots" min="1" required />
          <label><input type="checkbox" id="workshop-multiday" onchange="toggleWorkshopMultiDay()" /> Multi-day</label>
          <div id="workshop-days-group" class="hidden">
            <input type="number" id="workshop-days-available" placeholder="Days available" min="1" max="5" />
          </div>
          <input type="text" id="workshop-stripe" placeholder="Stripe Link (optional)" />
          <button type="button" class="btn" onclick="uploadWorkshop()">Add Workshop</button>
        </div>
      </form>
      <div id="workshops-admin-list"></div>
    </div>

    <button class="btn" onclick="saveChanges()" style="margin-top:1rem">💾 Save All Changes</button>
    <p id="save-status" style="margin-top:1rem;color:green"></p>
  </div>

  <!-- Edit Gallery Image Modal -->
  <div id="edit-gallery-modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeEditGalleryModal()">&times;</span>
      <div class="modal-header">
        <h3>Edit Gallery Image</h3>
      </div>
      <div class="modal-form-group">
        <img id="modal-gallery-preview"
          style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 4px; margin-bottom: 1rem;" />
      </div>
      <div class="modal-form-group">
        <label for="modal-gallery-title">Title:</label>
        <input type="text" id="modal-gallery-title" />
      </div>
      <div class="modal-form-group">
        <label for="modal-gallery-categories">Categories:</label>
        <select id="modal-gallery-categories" multiple size="5">
          <option value="Landscape">Landscape</option>
          <option value="Portrait">Portrait</option>
          <option value="Creatures">Creatures</option>
          <option value="Waterwork">Waterwork</option>
          <option value="Still Life">Still Life</option>
        </select>
        <small style="display: block; margin-top: 0.5rem; color: #666;">Hold Ctrl/Cmd to select multiple</small>
      </div>
      <div class="modal-form-group">
        <label><input type="checkbox" id="modal-gallery-featured" /> Featured on Home</label>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="saveEditGalleryImage()">Save Changes</button>
        <button class="btn" onclick="closeEditGalleryModal()" style="background-color: #ccc;">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>

</html>
